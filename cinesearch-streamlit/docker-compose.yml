services:

  # ── Service Elasticsearch ──
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node            # Nœud unique (pas de cluster).
      - xpack.security.enabled=false          # Sécurité désactivée pour le dev.
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"      # Limite mémoire JVM (chapitre 4.3).
    ports:
      - "9200:9200"                           # API REST Elasticsearch.
    volumes:
      - es-data:/usr/share/elasticsearch/data # Persistance des données.
    networks:
      - elastic
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q 'cluster_name'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Service Kibana ──
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: kibana
    ports:
      - "5601:5601"                           # Interface web Kibana.
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elastic
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q 'available' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── Service Streamlit ──
  streamlit:
    build:
      context: .                              # Racine du projet (où se trouve le Dockerfile).
      dockerfile: Dockerfile                  # Dockerfile à la racine.
    container_name: cinesearch_ui
    ports:
      - "8501:8501"                           # Interface web Streamlit.
    environment:
      - ELASTICSEARCH_HOST=http://elasticsearch:9200  # URL ES vue depuis Docker.
    depends_on:
      elasticsearch:
        condition: service_healthy            # Attend qu'ES soit prêt.
    volumes:
      - ./src:/app/src                        # Hot-reload : modifs sans rebuild.
      - ./data:/app/data     
    networks:
      - elastic
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8501/_stcore/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

# Volume nommé pour la persistance des données (chapitre 3.2).
volumes:
  es-data:
    driver: local

# Réseau dédié pour la communication inter-services (chapitre 4.3).
networks:
  elastic:
    driver: bridge

# ─────────────────────────────────────────────────────────────
# Commandes :
#   Démarrer les services :         docker compose up -d
#   Démarrer + rebuild Streamlit :  docker compose up -d --build
#   Accéder à CinéSearch :          http://localhost:8501
#   Vérifier qu'ES est prêt :       curl http://localhost:9200
#   Accéder à Kibana :              http://localhost:5601
#   Voir les logs :                 docker compose logs -f
#   Logs Streamlit uniquement :     docker compose logs -f streamlit
#   Voir l'état des services :      docker compose ps
#   Redémarrer les services :       docker compose restart
#   Arrêter (données conservées) :  docker compose down
#   Arrêter + supprimer données :   docker compose down -v
#   Supprimer images inutilisées :  docker compose down -v --remove-orphans
# ─────────────────────────────────────────────────────────────
